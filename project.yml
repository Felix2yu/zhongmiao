name: Zhongmiao

options:
  bundleIdPrefix: im.yufei
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  groupSortPosition: top

packages:
  ZhongmiaoCore:
    path: Packages/ZhongmiaoCore

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    ZM_BUILD_STAMP: "2026-10-27 14:56"
    SWIFT_VERSION: "6.4"
    # Swift 6.2 的默认 MainActor 隔离暂不全局开启：主 App 的 Sources/Shared
    # 同时包含 UI 与后台模型（193 个值类型被 actor 使用），需要先把数据模型
    # 标成 nonisolated 才能整体切换。Widget/App 目标后续单独迁移。
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Zhongmiao:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources/Shared
      - path: Sources/iOS
      - path: Resources/Shared
      - path: Resources/iOS
    dependencies:
      - package: ZhongmiaoCore
      - target: ZhongmiaoWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.yufei.zhongmiao
        PRODUCT_NAME: Zhongmiao
        ASSETCATALOG_COMPILER_APPICON_NAME: Zhongmiao
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_CFBundleDisplayName: 众妙
    info:
      path: Config/Info-iOS.plist
      properties:
        CFBundleDisplayName: 众妙
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ZMBuildStamp: $(ZM_BUILD_STAMP)
        CFBundleDevelopmentRegion: zh_CN
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # WebView 中承载的是自建 HTTP 服务，仅对网页内容放开 ATS，其余请求仍走 ATS。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 众妙需要访问局域网中的自建服务（如慎始、货殖等）。
        NSCalendarsUsageDescription: 众妙仅在你开启相关功能时读取日历中的演出时间，并把生日、纪念日等提醒写入名为「众妙」的日历。
        # 完整访问而非只写：写入后还要能读回，才能做幂等更新与清理。
        NSCalendarsFullAccessUsageDescription: 众妙仅在你开启相关功能时读取日历中的演出时间，并把生日、纪念日等提醒写入名为「众妙」的日历，交给系统在到点时提醒。
        NSRemindersFullAccessUsageDescription: 众妙需要把养护、日记与任务提醒写入名为「众妙」的提醒列表，由系统在到点时提醒。
        # 开演闹钟（AlarmKit）。只在用户在演出详情里手动打开时才排，默认一个都不排。
        NSAlarmKitUsageDescription: 众妙需要为你在演出详情里打开的「开演闹钟」创建系统闹钟，到点时由系统响铃。
        NSCameraUsageDescription: 上传照片或扫描内容时需要使用相机。
        NSPhotoLibraryUsageDescription: 从相册选择图片上传到你的自建服务。
        NSMicrophoneUsageDescription: 录制语音时需要使用麦克风。
        UIBackgroundModes:
          - fetch
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - im.yufei.zhongmiao.refresh
        # 允许本 App 开启实时活动（灵动岛 / 锁屏卡片）。这是 Info.plist 键，不是付费能力。
        NSSupportsLiveActivities: true
        # 自定义 URL scheme。免费账号拿不到 Associated Domains，Universal Links 不可用，
        # 深链（小组件、日历事件、通知回跳、快捷指令）只能走这一条路。
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: im.yufei.zhongmiao
            CFBundleURLSchemes:
              - zhongmiao

  ZhongmiaoWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources/Widget
    dependencies:
      - package: ZhongmiaoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.yufei.zhongmiao.widget
        PRODUCT_NAME: ZhongmiaoWidget
        # 扩展不单独归档，由主 App 内嵌。
        SKIP_INSTALL: YES
    info:
      path: Config/Info-Widget.plist
      properties:
        CFBundleDisplayName: 众妙小组件
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh_CN
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true

  ZhongmiaoMac:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources/Shared
      - path: Sources/macOS
      - path: Resources/Shared
      - path: Resources/macOS
    dependencies:
      - package: ZhongmiaoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.yufei.zhongmiao.mac
        PRODUCT_NAME: Zhongmiao
        ASSETCATALOG_COMPILER_APPICON_NAME: Zhongmiao
        COMBINE_HIDPI_IMAGES: YES
        INFOPLIST_KEY_CFBundleDisplayName: 众妙
    info:
      path: Config/Info-macOS.plist
      properties:
        CFBundleDisplayName: 众妙
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "27.0"
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 众妙需要访问局域网中的自建服务。
        NSCameraUsageDescription: 上传照片时需要使用相机。
        NSPhotoLibraryUsageDescription: 从相册选择图片上传到你的自建服务。
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: im.yufei.zhongmiao
            CFBundleURLSchemes:
              - zhongmiao

  ZhongmiaoUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: UITests
    dependencies:
      - target: Zhongmiao
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.yufei.zhongmiao.uitests
        TEST_TARGET_NAME: Zhongmiao
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Zhongmiao:
    build:
      targets:
        Zhongmiao: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  ZhongmiaoMac:
    build:
      targets:
        ZhongmiaoMac: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  ZhongmiaoUITests:
    build:
      targets:
        Zhongmiao: all
        ZhongmiaoUITests: [test]
    test:
      config: Debug
      targets:
        - ZhongmiaoUITests
